{% extends "index.html" %}

{% block title %}Autenticação - Login ou Cadastro{% endblock %}

{% block content %}
<div class="auth-container">
    <!-- Cabeçalho com alternância entre login/cadastro -->
    <div class="auth-header">
        <h1 class="auth-title">Bem-vindo</h1>
        <p class="auth-subtitle">Acesse sua conta ou crie uma nova</p>
    </div>
    
    <!-- Abas para alternar entre login e cadastro -->
    <div class="auth-tabs">
        <button class="tab-btn active" onclick="showTab('login')" id="tab-login">Login</button>
        <button class="tab-btn" onclick="showTab('register')" id="tab-register">Criar Conta</button>
    </div>
    
    <!-- Formulário de Login -->
    <div id="login-form" class="auth-form active">
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="login-email">
                    <i class="fas fa-envelope"></i>
                    E-mail
                </label>
                <input 
                    type="email" 
                    id="login-email" 
                    name="email" 
                    placeholder="seu@email.com" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="login-password">
                    <i class="fas fa-lock"></i>
                    Senha
                </label>
                <div class="password-input">
                    <input 
                        type="password" 
                        id="login-password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('login-password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember">
                    <span>Lembrar-me</span>
                </label>
                <a href="/recuperar-senha" class="forgot-password">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" class="auth-btn btn-login">
                <i class="fas fa-sign-in-alt"></i>
                Entrar
            </button>
        </form>
        
        <div class="auth-divider">
            <span>ou</span>
        </div>
        
        <!-- Botões de login social (opcional) -->
        <div class="social-auth">
            <button class="social-btn google" onclick="socialLogin('google')">
                <i class="fab fa-google"></i>
                Continuar com Google
            </button>
            <button class="social-btn github" onclick="socialLogin('github')">
                <i class="fab fa-github"></i>
                Continuar com GitHub
            </button>
        </div>
    </div>
    
    <!-- Formulário de Cadastro -->
    <div id="register-form" class="auth-form">
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="register-name">
                    <i class="fas fa-user"></i>
                    Nome completo
                </label>
                <input 
                    type="text" 
                    id="register-name" 
                    name="name" 
                    placeholder="João Silva" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="register-email">
                    <i class="fas fa-envelope"></i>
                    E-mail
                </label>
                <input 
                    type="email" 
                    id="register-email" 
                    name="email" 
                    placeholder="seu@email.com" 
                    required
                >
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label for="register-password">
                        <i class="fas fa-lock"></i>
                        Senha
                    </label>
                    <div class="password-input">
                        <input 
                            type="password" 
                            id="register-password" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('register-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group half">
                    <label for="register-confirm-password">
                        <i class="fas fa-lock"></i>
                        Confirmar senha
                    </label>
                    <div class="password-input">
                        <input 
                            type="password" 
                            id="register-confirm-password" 
                            name="confirm_password" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>
                </div>
            </div>
            
            <div class="form-group terms">
                <label class="checkbox-label">
                    <input type="checkbox" name="terms" required>
                    <span>Eu concordo com os <a href="/termos" target="_blank">Termos de Serviço</a> e <a href="/privacidade" target="_blank">Política de Privacidade</a></span>
                </label>
            </div>
            
            <button type="submit" class="auth-btn btn-register">
                <i class="fas fa-user-plus"></i>
                Criar minha conta
            </button>
        </form>
    </div>
    
    <!-- Área para mensagens de erro/sucesso -->
    {% if message %}
    <div class="auth-message {{ message.type }}">
        <i class="fas fa-{% if message.type == 'success' %}check-circle{% else %}exclamation-circle{% endif %}"></i>
        <span>{{ message.text }}</span>
    </div>
    {% endif %}
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    // Função para alternar entre login e cadastro
    function showTab(tabName) {
        // Atualizar abas
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('tab-register').classList.remove('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
        
        // Atualizar formulários
        document.getElementById('login-form').classList.remove('active');
        document.getElementById('register-form').classList.remove('active');
        document.getElementById(`${tabName}-form`).classList.add('active');
        
        // Atualizar URL sem recarregar (opcional)
        const url = new URL(window.location);
        url.searchParams.set('tab', tabName);
        window.history.pushState({}, '', url);
    }
    
    // Verificar se há parâmetro de aba na URL
    window.addEventListener('load', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const tab = urlParams.get('tab');
        if (tab === 'register') {
            showTab('register');
        }
    });
</script>
{% endblock %}
