{% for filme in filmes %}
    <div class="bg-gray-800 rounded-lg overflow-hidden shadow-lg transition-transform transform hover:scale-105">
        
        {% if filme.poster_path %}
            <img src="https://image.tmdb.org/t/p/w500{{ filme.poster_path }}" alt="Pôster de {{ filme.title }}" class="w-full h-auto object-cover aspect-[2/3]">
        {% else %}
            <div class="w-full aspect-[2/3] bg-gray-700 flex items-center justify-center text-gray-500">
                Sem Pôster
            </div>
        {% endif %}
        
        <div class="p-4">
            <h3 class="text-white font-bold text-lg truncate" title="{{ filme.title }}">{{ filme.title }}</h3>
            <p class="text-gray-400 text-sm mt-1">{{ filme.release_date[:4] if filme.release_date else 'N/A' }}</p>
            
            <a href="/filme/{{ filme.id }}" class="mt-3 block text-center w-full border border-brand text-brand hover:bg-brand hover:text-white font-bold py-1 px-2 rounded text-sm transition-colors">
                + Detalhes
            </a>
        </div>
    </div>
{% else %}
    <div class="col-span-full text-center text-gray-400 py-8">
        Nenhum filme encontrado. Comece a digitar para buscar!
    </div>
{% endfor %}
